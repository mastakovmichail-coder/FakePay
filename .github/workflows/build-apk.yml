name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Собрать APK терминала
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Создать Android-проект
        run: npx cap add android

      - name: Подключить NFC-плагин
        run: node setup-android.js

      - name: Синхронизировать веб-часть
        run: npx cap sync android

      - name: Собрать debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: FakePay-Terminal-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
